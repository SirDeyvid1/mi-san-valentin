<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag vital para iOS: evita que la pantalla haga zoom al tocar botones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una pregunta especial</title>
    <style>
        /* --- ESTILO TIPO iOS --- */
        :root {
            --bg-color: #f2f2f7; /* Gris claro de fondo de iOS */
            --card-bg: #ffffff;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --btn-yes-bg: #ff2d55; /* Rosa/Rojo estilo Apple */
            --btn-no-bg: #e5e5ea;  /* Gris claro para botón secundario */
            --btn-no-text: #ff3b30; /* Letras rojas para el No */
        }

        body {
            margin: 0;
            padding: 0;
            /* Llama a la fuente oficial de Apple si se abre en iPhone */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 24px;
            border-radius: 24px; /* Esquinas muy redondeadas tipo iOS */
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* Sombra difuminada */
            width: 85%;
            max-width: 340px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 0;
        }

        .buttons {
            display: flex;
            flex-direction: column; /* Botones apilados, mejor para móviles */
            gap: 12px;
        }

        .btn {
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            /* Animación suave al soltar el botón */
            transition: transform 0.1s ease, opacity 0.2s;
        }

        /* Efecto al presionar la pantalla */
        .btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .btn-yes {
            background-color: var(--btn-yes-bg);
            color: white;
        }

        .btn-no {
            background-color: var(--btn-no-bg);
            color: var(--btn-no-text);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- PANTALLA PRINCIPAL -->
    <div class="card" id="questionSection">
        <h1>¿Quieres salir conmigo?</h1>
        <div class="buttons">
            <button id="btnYes" class="btn btn-yes">Sí</button>
            <button id="btnNo" class="btn btn-no">No</button>
        </div>
    </div>

    <!-- PANTALLA DE RESPUESTA: SÍ -->
    <div class="card hidden" id="yesSection">
        <h1>¡Qué emoción! 🥰</h1>
        <p>Me hace muy feliz tu respuesta. Ya planearemos algo genial.</p>
    </div>

    <!-- PANTALLA DE RESPUESTA: NO -->
    <div class="card hidden" id="noSection">
        <h1>Entiendo 😌</h1>
        <p>Gracias por tu sinceridad. ¡No te preocupes por nada!</p>
    </div>

    <script>
        // Referencias a los elementos visuales
        const questionSection = document.getElementById('questionSection');
        const yesSection = document.getElementById('yesSection');
        const noSection = document.getElementById('noSection');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');

        // Credenciales de Telegram (Tus datos confirmados)
        const botToken = "8884501529:AAHLotb1U_4BLg8GvYmMb-SYzoWjXJLawCk";
        const chatId = "1895780525";

        // Función reutilizable para enviar el mensaje a Telegram
        function notificarTelegram(mensaje) {
            const textoCodificado = encodeURIComponent(mensaje);
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${textoCodificado}`)
                .catch(() => {}); // Silencioso para el usuario
        }

        // Lógica del botón SÍ
        btnYes.addEventListener('click', () => {
            questionSection.style.display = 'none';
            yesSection.classList.remove('hidden');
            notificarTelegram("🟢 ¡Dijo que SÍ! La respuesta a salir contigo ha sido afirmativa. 🥰");
        });

        // Lógica del botón NO
        btnNo.addEventListener('click', () => {
            questionSection.style.display = 'none';
            noSection.classList.remove('hidden');
            notificarTelegram("🔴 Dijo que NO. Ha presionado el botón rechazando la invitación. 😌");
        });
    </script>
</body>
</html>
